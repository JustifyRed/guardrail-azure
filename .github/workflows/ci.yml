# CI — every push to a feature branch and every PR into main.
# Feature-branch pushes get static gates only: the plan identity does NOT trust
# feature branches (see bootstrap/identity.tf), so they can never reach Azure.
# PRs additionally get a read-only Terraform plan posted as a comment.
name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "~1.13"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: environments/dev

jobs:
  static:
    uses: ./.github/workflows/_static-checks.yml
    permissions:
      contents: read
      security-events: write

  plan:
    name: terraform plan (read-only identity)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Entra ID — no secrets stored
      pull-requests: write # post plan summary
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform -chdir=$WORKDIR init -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}"

      - name: terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform -chdir=$WORKDIR plan -var-file=dev.tfvars -lock-timeout=5m -out=tfplan
          terraform -chdir=$WORKDIR show -no-color tfplan > plan.txt

      - name: comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated)';
            const marker = '<!-- guardrail-plan -->';
            const body = `${marker}\n### Terraform plan — \`${process.env.WORKDIR}\`\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>\n\n_Read-only identity. Applies happen only after merge + approval._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
